; kvrgw_perf.ini - settings for kvrgw_perf.py
;
; Precedence (highest first):
;   1. --set section.key=value / dedicated CLI flags
;   2. environment variables named in the comments below (e.g. PERF_DURATION=600 PIN=1)
;   3. this file
;   4. built-in defaults (the values shown here)
; An empty value means "unset".

[run]
; Default N for `kvrgw_perf.py run`.
instances = 3
; Tenant of instance i is <tenant_prefix>-<run-id>-<i> (env PERF_TENANT_PREFIX).
tenant_prefix = perf
; Pin each instance to its own slice of cores via docker --cpuset-cpus (env PIN).
; With more instances than cores, cores are shared round-robin.
pin = no
; Cores to spread over, e.g. 0-7,16-23. Empty = all online cores (env CPU_LIST).
cpu_list =
; Print live aggregate throughput and write <logdir>/live.csv (env LIVE).
live = yes
; Seconds between live lines (env LIVE_INTERVAL).
live_interval = 2
; Driver metrics sampling period; 0 disables metrics and the live view
; (env KVRGW_METRICS_INTERVAL_MS).
metrics_interval_ms = 1000
; Empty = ./perf-logs/<run-id> (env LOGDIR / RUN_ID).
logdir =
run_id =

[docker]
; env DOCKER, IMAGE, TARBALL, DOCKER_RUN_ARGS, CLUSTER_FILE
docker = docker
image = kvrgw-gw
; Always docker-loaded before run/interactive. Relative paths are relative to
; the directory of kvrgw_perf.py.
tarball = kvrgw-gw.tar.gz
; Extra `docker run` args. An empty value disables them.
run_args = --security-opt seccomp=unconfined
; Host FDB cluster file, mounted read-only into every container.
cluster_file = /etc/foundationdb/fdb.cluster

[backend]
; Forwarded to every container as KVRGW_* environment variables (env: same names,
; e.g. KVRGW_BATCH_SIZE). Empty values are not forwarded.
;
; Storage tiers (bytes): <= max_inline is inline in the metadata record;
; <= max_kv_store is a separate FDB key; larger goes to a file.
max_inline = 256
max_kv_store = 4096
; PUT batch coalescing: one FDB transaction per batch (1 disables, max 16).
; set-batch is sent to the driver only when all three are set.
batch_size = 10
batch_timeout_us = 1000
batch_threads = 8
; Object naming and tags: <prefix_len>-char prefix/.../<suffix_len>-char suffix,
; tag_count tags of tag_data_size bytes.
prefix_len = 16
suffix_len = 8
tag_count = 2
tag_name_base = mytag
tag_data_size = 200
; Unset by default (driver defaults apply).
batch_max_inflight =
kv_store_coalescing =
gomaxprocs =
debug =
key_prefix =
key_suffix =
random_prefix_per_key =
metadata_count =
metadata_data_size =
root_access_key =
root_secret_key =
aws_default_region =
; Used only by `interactive`; `run` sets a tenant per instance.
tenant_name =

[workload]
; Per instance, not total: every instance gets its own tenant and buckets
; (env PERF_*).
buckets = 4
mode = versioned
; Concurrency per instance.
c = 128
tiers = 8192
; Seconds.
duration = 180
burst = 5
sim_disk_write_us = 0
sim_disk_read_us = 0
; yes: delete objects and buckets after the run.
cleanup = no
; Extra driver commands, one per line, run after `put` (before cleanup/quit).
; extra_commands =
;     batch-stats
extra_commands =
